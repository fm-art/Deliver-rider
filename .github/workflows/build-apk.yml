name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-apk:
    name: Build GB Admin APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 36 SDK Platform
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install NPM Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Vite Web App
        env:
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
        run: npm run build

      - name: Generate Android Project & Sync
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Apply App Icon
        run: |
          ICON_SRC="public/pwa-512x512.png"
          MASK_SRC="public/pwa-maskable-512x512.png"
          if [ -f "$ICON_SRC" ]; then
            for dir in android/app/src/main/res/mipmap-*dpi; do
              if [ -d "$dir" ]; then
                cp "$ICON_SRC" "$dir/ic_launcher.png"
                cp "$ICON_SRC" "$dir/ic_launcher_round.png"
                if [ -f "$MASK_SRC" ]; then
                  cp "$MASK_SRC" "$dir/ic_launcher_foreground.png"
                else
                  cp "$ICON_SRC" "$dir/ic_launcher_foreground.png"
                fi
                cp "$ICON_SRC" "$dir/ic_launcher_background.png"
              fi
            done
          fi

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename Output APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk GB-Admin.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GB-Admin-APK
          path: GB-Admin.apk
          retention-days: 30

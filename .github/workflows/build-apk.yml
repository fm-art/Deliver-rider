name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-apk:
    name: Build GB Admin APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 36 SDK Platform
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install NPM Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Vite Web App
        env:
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
        run: npm run build

      - name: Generate Android Project & Sync
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Apply App Icon from public/pwa-512x512.png
        continue-on-error: true
        run: |
          if [ -f "public/pwa-512x512.png" ]; then
            mkdir -p assets
            cp public/pwa-512x512.png assets/icon-only.png
            cp public/pwa-512x512.png assets/icon-foreground.png
            npx --yes @capacitor/assets generate --android --iconBackgroundColor '#060911'
          fi

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename Output APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk GB-Admin.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GB-Admin-APK
          path: GB-Admin.apk
          retention-days: 30
